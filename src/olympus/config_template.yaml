# ==============================================================================
# Olympus — fold-change Thermal Proteome Profiling (Python port of FC.TPP)
# Annotated configuration. CLI options always override this file.
#   olympus analyze --config olympus_config.yaml
#   olympus analyze --config olympus_config.yaml --set call.rule=r_legacy
# ==============================================================================

# ── 1. Inputs: the X Deimos result workbooks (one Deimos run per temperature) ─
# Checklist for the X Deimos runs (Olympus checks it and warns):
#   - same design order and same control (control_condition) at every temperature
#     -> identical contrast names (a reversed contrast is flipped back automatically)
#   - same processing everywhere (impute_method explicit, not 'auto'; same FDR mode)
#   - same primary statistic: a report.pr_matrix.tsv for every temperature or for none
#     (Deimos 'dpc' falls back to imputation when the pr_matrix is missing)
input:
  mode: deimos                       # deimos | long-table
  deimos_root: deimos_results        # accepted layouts:
                                     #   deimos_results/T1/ProteomicAnalysis_Results.xlsx
                                     #   deimos_results/T1/proteomics_output/ProteomicAnalysis_Results.xlsx
                                     #   deimos_results/T1_ProteomicAnalysis_Results.xlsx
  workbook_glob: "**/*ProteomicAnalysis_Results*.xlsx"
  temperature_regex: null            # e.g. '(T\d+)' if folders are named 'TPP_T1_output'...
  manifest: null                     # or a CSV: temperature,results_path[,temperature_c]
  long_table: null                   # long-table mode: CSV/XLSX with Temperature, name, <c>_diff, <c>_p.val
  long_table_sheet: null

# Temperatures in °C (optional, used for axes and ordering). Dict or CSV path.
temperatures_celsius: null
#  T1: 37.0
#  T2: 40.4

# ── 2. Protein filter (R tidy_tpp) ───────────────────────────────────────────
# Integer = number of temperatures (R defaults 6/6 were set for 12 points);
# value < 1 = fraction of the X temperatures (0.5 = half, rounded up).
filter:
  min_temperatures: 6                # quantified at >= 6 temperatures
  min_streak: 6                      # ... including >= 6 adjacent temperatures

# ── 3. Thermal-shift call ────────────────────────────────────────────────────
call:
  fc_cutoff: 0.6                     # |log2 FC|
  logp_cutoff: 2.0                   # -log10(p): 2 = p < 0.01
  p_column: p.val                    # p.val (R behaviour) | p.adj (Deimos BH per contrast)
  min_consecutive: 2
  rule: strict                       # strict = adjacent temperatures + same sign
                                     # r_legacy = exact R behaviour (successive rows, any sign)
  abundance_check: true              # flag hits already present at the lowest temperature

# ── 4. Figures ───────────────────────────────────────────────────────────────
plots:
  volcano: true
  volcano_layout: grid               # grid = 1 page per contrast | pages = R layout
  volcano_all_proteins: true
  volcano_fc_cutoff: null            # null = call.fc_cutoff
  volcano_logp_cutoff: null
  profiles: true
  profiles_view: both                # FC | pval | both
  profiles_pick: both                # All_prot | Over_th | both
  plot3d: true
  plotly_js: embed                   # embed (works offline) | cdn | directory
  gif: false
  label_column: Genes                # labels on figures (accession if empty)

# ── 5. Outputs ───────────────────────────────────────────────────────────────
output:
  out_dir: olympus_output
  excel: Olympus_Results.xlsx
  csv: true
