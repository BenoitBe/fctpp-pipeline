name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test suite (synthetic data; real-data suites are skipped)
        run: pytest -q

      - name: Smoke test on the example dataset
        run: |
          python example_data/make_synthetic.py
          fctpp analyze --deimos-root example_data/deimos_results \
                        --celsius example_data/temperatures.csv -o /tmp/smoke
          test -f /tmp/smoke/FCTPP_Results.xlsx
          test -f /tmp/smoke/volcano_plots.pdf
          test -f /tmp/smoke/TPP_plots.pdf
          test -f /tmp/smoke/C1_vs_Ctl_plot3D.html
