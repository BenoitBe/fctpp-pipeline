[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "olympus-tpp"
dynamic = ["version"]
description = "Olympus — fold-change Thermal Proteome Profiling on per-temperature Deimos results (Python port of FC.TPP)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Artistic-2.0" }
authors = [
  { name = "Benoit Bernay", email = "benoit.bernay@unicaen.fr" },
  { name = "Anthony Sleiman", email = "anthony.sleiman@univ-rouen.fr" },
  { name = "Alexandre Mahe", email = "alexandre.mahe@unicaen.fr" },
]
keywords = ["proteomics", "thermal proteome profiling", "TPP", "DIA-NN", "mass spectrometry"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "openpyxl>=3.1",
  "matplotlib>=3.6",
  "plotly>=5.15",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
labels = ["adjustText>=0.8"]
dev = ["pytest>=7", "adjustText>=0.8"]

[project.scripts]
olympus = "olympus.cli:main"

[project.urls]
Homepage = "https://github.com/BenoitBe/olympus-tpp-pipeline"
Deimos = "https://github.com/BenoitBe/deimos-proteomics-pipeline"

[tool.setuptools.dynamic]
version = { attr = "olympus.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
olympus = ["config_template.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "realdata: needs the R FC.TPP project folder (set OLYMPUS_R_PROJECT)",
  "deimos: needs real Deimos result workbooks (set OLYMPUS_DEIMOS_RESULTS); slow",
]
filterwarnings = ["ignore::DeprecationWarning"]
