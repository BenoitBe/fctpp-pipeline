[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fctpp"
dynamic = ["version"]
description = "FC.TPP — fold-change based Thermal Proteome Profiling on per-temperature Deimos results"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Artistic-2.0" }
authors = [
  { name = "Benoit Bernay", email = "benoit.bernay@unicaen.fr" },
  { name = "Anthony Sleiman", email = "anthony.sleiman@univ-rouen.fr" },
  { name = "Alexandre Mahe", email = "alexandre.mahe@unicaen.fr" },
]
keywords = ["proteomics", "thermal proteome profiling", "TPP", "DIA-NN", "mass spectrometry"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "openpyxl>=3.1",
  "matplotlib>=3.6",
  "plotly>=5.15",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
labels = ["adjustText>=0.8"]
dev = ["pytest>=7", "adjustText>=0.8"]

[project.scripts]
fctpp = "fctpp.cli:main"

[project.urls]
Homepage = "https://github.com/BenoitBe/fctpp-pipeline"
Deimos = "https://github.com/BenoitBe/deimos-proteomics-pipeline"

[tool.setuptools.dynamic]
version = { attr = "fctpp.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fctpp = ["config_template.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "realdata: needs the FC.TPP R project folder (set FCTPP_R_PROJECT)",
  "deimos: needs real Deimos result workbooks (set FCTPP_DEIMOS_RESULTS); slow",
]
filterwarnings = ["ignore::DeprecationWarning"]
